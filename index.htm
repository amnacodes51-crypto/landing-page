
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gateway</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- Navbar -->

    <header>

        <div class="logo">
            <h2>✈ The Gateway.</h2>
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Explore</a>
            <a href="#">Destinations</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>

        <div class="search-icon">
            <span>⌕</span>
        </div>

    </header>


    <!-- Main Section -->

    <main>

        <!-- Background Picture -->

        <div class="background-image">
            <img src="./bg pic.png" alt="Travel Destination">
        </div>


        <!-- Hero Content -->

        <div class="content">

            <h1>
                Discover The Beauty
                <br>
                Of The World
                <span>♡</span>
            </h1>

            <p>
                Explore amazing destinations, experience new cultures
                <br>
                and create unforgettable memories with us.
            </p>


            <!-- Search Bar -->

            <div class="search-box">

                <span class="search-symbol">⌕</span>

                <input type="text"
                placeholder="Search your destination...">

                <button>Search</button>

            </div>

        </div>

    </main>

</body>
</html>
